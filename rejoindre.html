<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quack — Rejoindre un groupe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #111827; --bg-sidebar: #0F172A; --bg-card: #1F2937;
            --accent: #FBBF24; --accent-hover: #F59E0B; --danger: #EF4444;
            --text-main: #F9FAFB; --text-secondary: #9CA3AF; --border: #374151;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, var(--bg-sidebar) 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 20px; color: var(--text-main);
        }
        .container { width: 100%; max-width: 400px; }
        .invite-box {
            background: var(--bg-card); border-radius: 20px; padding: 40px 32px; text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .quack-logo { font-size: 36px; margin-bottom: 18px; }
        .invite-emoji {
            font-size: 52px; width: 96px; height: 96px; margin: 0 auto 16px; background: var(--bg-main);
            border: 3px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .invite-name { font-family: 'Quicksand', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .invite-desc { color: var(--text-secondary); font-size: 13px; margin-bottom: 10px; line-height: 1.5; }
        .invite-count { color: var(--text-secondary); font-size: 13px; margin-bottom: 22px; }
        .submit-btn {
            width: 100%; padding: 13px; background: var(--accent); color: #111827; border: none;
            border-radius: 10px; font-size: 14px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; cursor: pointer; transition: all 0.25s ease; font-family: inherit;
        }
        .submit-btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .info-message { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin-bottom: 18px; }
        .error-message {
            background: rgba(239, 68, 68, 0.12); border: 1px solid var(--danger); color: #FCA5A5;
            padding: 10px; border-radius: 10px; font-size: 12px; margin-top: 14px; display: none;
        }
        .error-message.show { display: block; }
        .text-link { color: var(--accent); text-decoration: underline; font-size: 13px; }
        .loading-spinner { font-size: 30px; animation: spin 1.2s linear infinite; display: inline-block; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
    <div class="container">
        <div class="invite-box">
            <div class="quack-logo">🦆 Quack</div>
            <div id="content"><div class="loading-spinner">🦆</div></div>
            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const params = new URLSearchParams(window.location.search);
            const code = (params.get('code') || '').trim().toUpperCase();
            const contentEl = document.getElementById('content');

            if (!code || code.length !== 6) {
                contentEl.innerHTML = '';
                const msg = document.createElement('p');
                msg.className = 'info-message';
                msg.textContent = "Lien d'invitation invalide.";
                const link = document.createElement('a');
                link.className = 'text-link';
                link.href = 'accueil.html';
                link.textContent = "Retour à l'accueil";
                contentEl.appendChild(msg);
                contentEl.appendChild(link);
                return;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = 'connexion.html?redirect=' + encodeURIComponent('rejoindre.html?code=' + code);
                return;
            }

            const { data, error } = await supabaseClient.rpc('preview_group_by_code', { code: code });

            if (error || !data || data.length === 0) {
                contentEl.innerHTML = '';
                const msg = document.createElement('p');
                msg.className = 'info-message';
                msg.textContent = "Ce code d'invitation n'existe pas ou plus.";
                const link = document.createElement('a');
                link.className = 'text-link';
                link.href = 'groupes.html';
                link.textContent = 'Voir mes groupes';
                contentEl.appendChild(msg);
                contentEl.appendChild(link);
                return;
            }

            renderPreview(data[0], code);
        });

        function renderPreview(group, code) {
            const contentEl = document.getElementById('content');
            contentEl.innerHTML = '';

            const emoji = document.createElement('div');
            emoji.className = 'invite-emoji';
            emoji.textContent = group.emoji;
            contentEl.appendChild(emoji);

            const name = document.createElement('div');
            name.className = 'invite-name';
            name.textContent = group.name;
            contentEl.appendChild(name);

            if (group.description) {
                const desc = document.createElement('div');
                desc.className = 'invite-desc';
                desc.textContent = group.description;
                contentEl.appendChild(desc);
            }

            const count = document.createElement('div');
            count.className = 'invite-count';
            const memberCount = Number(group.member_count) || 0;
            count.textContent = memberCount + ' membre' + (memberCount > 1 ? 's' : '');
            contentEl.appendChild(count);

            const joinBtn = document.createElement('button');
            joinBtn.type = 'button';
            joinBtn.className = 'submit-btn';
            joinBtn.textContent = 'Rejoindre';
            joinBtn.addEventListener('click', async function () {
                joinBtn.disabled = true;
                joinBtn.textContent = 'Un instant...';
                const errorEl = document.getElementById('errorMessage');
                errorEl.classList.remove('show');

                const { error } = await supabaseClient.rpc('join_group_by_code', { code: code });

                if (error) {
                    errorEl.textContent = error.message || 'Impossible de rejoindre ce groupe.';
                    errorEl.classList.add('show');
                    joinBtn.disabled = false;
                    joinBtn.textContent = 'Rejoindre';
                    return;
                }

                joinBtn.textContent = 'Rejoint ! Redirection...';
                setTimeout(function () { window.location.href = 'groupes.html'; }, 700);
            });
            contentEl.appendChild(joinBtn);
        }
    </script>
</body>
</html>
